
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: jira-notifier-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package Windows application
        shell: pwsh
        run: |
          $candidates = @(
            "build/windows/x64/runner/Release",
            "build/windows/runner/Release"
          )

          $releaseDir = $candidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $releaseDir) {
            throw "Windows release directory not found."
          }

          if (-not (Get-ChildItem $releaseDir -Filter *.exe)) {
            throw "No executable found in $releaseDir"
          }

          New-Item -ItemType Directory -Force release-assets |
            Out-Null

          Compress-Archive `
            -Path "$releaseDir/*" `
            -DestinationPath "release-assets/jira-notifier-windows.zip"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jira-notifier-windows
          path: release-assets/jira-notifier-windows.zip
          if-no-files-found: error

  macos:
    name: macOS build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package macOS application
        shell: bash
        run: |
          set -e

          APP_PATH="$(find build/macos/Build/Products/Release \
            -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app bundle found."
            exit 1
          fi

          mkdir -p release-assets

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            release-assets/jira-notifier-macos.zip

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jira-notifier-macos
          path: release-assets/jira-notifier-macos.zip
          if-no-files-found: error

  ios:
    name: iOS compile check
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        shell: bash
        run: |
          set -e

          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "iOS app bundle not found: $APP_PATH"
            exit 1
          fi

          mkdir -p release-assets

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            release-assets/jira-notifier-ios-unsigned.zip

      - name: Upload unsigned iOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jira-notifier-ios-unsigned
          path: release-assets/jira-notifier-ios-unsigned.zip
          if-no-files-found: error
