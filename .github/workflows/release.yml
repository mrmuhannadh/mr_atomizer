name: Flutter Multi-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Package Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            release-assets/jira-notifier-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/jira-notifier-android.apk
          if-no-files-found: error

  windows:
    name: Package Windows installer and ZIP
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package Windows application
        shell: pwsh
        run: |
          $releaseDir = @(
            "build/windows/x64/runner/Release",
            "build/windows/runner/Release"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $releaseDir) {
            throw "Windows release directory not found."
          }

          $exe = Get-ChildItem $releaseDir -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            throw "No executable found in $releaseDir"
          }

          # Ship the Visual C++ runtime so the app also starts on PCs without it
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            $src = Join-Path $env:SystemRoot "System32\$dll"
            if (Test-Path $src) {
              Copy-Item $src $releaseDir -Force
            } else {
              Write-Warning "$dll not found on the runner"
            }
          }

          New-Item -ItemType Directory -Force release-assets | Out-Null

          # 1) Portable ZIP
          Compress-Archive `
            -Path "$releaseDir/*" `
            -DestinationPath "release-assets/jira-notifier-windows.zip" `
            -Force

          # 2) Installer (Program Files + Start menu + desktop shortcut)
          choco install innosetup -y --no-progress

          $version = "${{ github.ref_name }}".TrimStart('v')
          $source  = (Resolve-Path $releaseDir).Path

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "/DMyAppExe=$($exe.Name)" `
            "/DSourceDir=$source" `
            "installer/windows.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release-assets/jira-notifier-windows.zip
            release-assets/jira-notifier-windows-setup.exe
          if-no-files-found: error

  macos:
    name: Package macOS application
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      - name: Package macOS app
        shell: bash
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release \
            -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app bundle found."
            exit 1
          fi

          mkdir -p release-assets

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            release-assets/jira-notifier-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-assets/jira-notifier-macos.zip
          if-no-files-found: error

  ios:
    name: Package unsigned iOS build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 | tee ios-build.log

      - name: Package iOS build output
        shell: bash
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected iOS app bundle not found: $APP_PATH"
            exit 1
          fi

          mkdir -p release-assets

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            release-assets/jira-notifier-ios-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release-assets/jira-notifier-ios-unsigned.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, windows, macos, ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*-release"
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jira Notifier ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/jira-notifier-android.apk
            release-assets/jira-notifier-windows-setup.exe
            release-assets/jira-notifier-windows.zip
            release-assets/jira-notifier-macos.zip
            release-assets/jira-notifier-ios-unsigned.zip
